<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Dict CSS Test</title>
    <style>
        /* ── Base ── */
        .yomitan-glossary {
            font-family: sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: #222;
        }

        /* ── Dictionary block ── */
        .yomitan-glossary li[data-dictionary] {
            border-left: 3px solid #d0d0d0;
            padding: 6px 10px 6px 12px;
            margin-bottom: 10px;
            background: #fafafa;
            border-radius: 0 6px 6px 0;
            list-style-type: none;
        }

        /* ── Accent colors per dict ── */
        .yomitan-glossary li[data-dictionary="Jitendex"] {
            border-color: #5b8dee;
        }

        .yomitan-glossary li[data-dictionary="新和英"] {
            border-color: #e07b39;
        }

        .yomitan-glossary li[data-dictionary="類語例解辞典"] {
            border-color: #7cbb6a;
        }

        .yomitan-glossary li[data-dictionary="漢検漢字辞典"] {
            border-color: #b06acd;
        }

        .yomitan-glossary li[data-dictionary="小学館例解"] {
            border-color: #e0a020;
        }

        .yomitan-glossary li[data-dictionary="大辞泉"] {
            border-color: #d95b5b;
        }

        /* ── Dict label (dimmed and small) ── */
        /* Yomitan natively sets the dictionary name in a <i> tag? Actually I'm not entirely sure where the name goes, but usually Yomitan hides headers or we inject them? The user's prompt implies there is an `<i>` label: "the <i> label dimmed and small" */
        .yomitan-glossary li[data-dictionary]>i,
        .yomitan-glossary li[data-dictionary]>.dict-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 4px;
            font-style: normal;
        }

        /* ── Definitions with consistent spacing ── */
        .yomitan-glossary ul,
        .yomitan-glossary ol {
            margin: 0;
            padding-left: 20px;
        }

        .yomitan-glossary li {
            margin-bottom: 4px;
        }

        /* ── Plain text entries (e.g. NHK, 新和英) clean line spacing ── */
        .yomitan-glossary li[data-dictionary="新和英"],
        .yomitan-glossary li[data-dictionary="NHK日本語発音アクセント新辞典"] {
            line-height: 1.8;
        }

        /* ── data-sc-num numbers styled as markers ── */
        .yomitan-glossary [data-sc-num] {
            font-size: 12px;
            font-weight: 700;
            color: #aaa;
            margin-right: 6px;
            display: inline-block;
            min-width: 18px;
        }

        /* ── data-sc-ex example sentences indented and dimmed ── */
        .yomitan-glossary [data-sc-ex],
        .yomitan-glossary [data-sc-ex-g] {
            display: block;
            margin-top: 2px;
            margin-bottom: 6px;
            margin-left: 12px;
            color: #666;
            font-size: 0.95em;
            border-left: 2px solid #ccc;
            padding-left: 8px;
        }

        /* ── 類語例解辞典 tables readable with borders ── */
        .yomitan-glossary li[data-dictionary="類語例解辞典"] table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 6px;
            font-size: 13px;
        }

        .yomitan-glossary li[data-dictionary="類語例解辞典"] th,
        .yomitan-glossary li[data-dictionary="類語例解辞典"] td {
            border: 1px solid #ccc;
            padding: 4px 6px;
        }

        .yomitan-glossary [data-sc-name] {
            font-weight: bold;
            margin-top: 4px;
            display: inline-block;
        }

        /* ── Pixiv footer hidden ── */
        .yomitan-glossary [data-sc-pixiv="footer"] {
            display: none !important;
        }

        /* ── Dict Specific Layout Helpers ── */
        .yomitan-glossary [data-sc-content="level1"],
        .yomitan-glossary [data-sc-content="L3"],
        .yomitan-glossary [data-sc-l3],
        .yomitan-glossary [data-sc-mg],
        .yomitan-glossary [data-sc-meaning],
        .yomitan-glossary [data-sc-head2] {
            display: block;
            margin-top: 4px;
        }

        .yomitan-glossary [data-sc-pixiv="parent-link"],
        .yomitan-glossary [data-sc-pixiv="summary"] {
            display: block;
            margin-bottom: 4px;
        }

        /* Jitendex classes untouched... */
    </style>
</head>

<body>

    <div class="yomitan-glossary">
        <ul>
            <!-- 小学馆 raw HTML sim -->
            <li data-dictionary="小学館例解">
                <i>小学館例解</i>
                <ul>
                    <li>
                        <span data-sc-num="❶">❶</span><span data-sc-content="level1">ある気持ちを心にいだく。感じる <br><span
                                data-sc-ex="1">ほめられてうれしく思った。</span></span>
                    </li>
                </ul>
            </li>

            <!-- 類語 raw HTML sim -->
            <li data-dictionary="類語例解辞典">
                <i>類語例解辞典</i>
                <div data-sc-name="意味">物事を理解・感受するために心を働かす</div>
                <table>
                    <tr>
                        <th>類語</th>
                        <th>違い</th>
                    </tr>
                    <tr>
                        <td>思う</td>
                        <td>主観的・感情的</td>
                    </tr>
                </table>
            </li>

            <!-- 新和英 raw HTML sim -->
            <li data-dictionary="新和英">
                <i>新和英</i>
                think; consider; believe;<br>
                think of doing; intend / plan to do;<br>
                expect; look forward to;
            </li>
        </ul>
    </div>

</body>

</html>
